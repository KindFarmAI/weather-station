name: Обновление прогноза погоды

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  allow-cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Загрузка прогнозов
        run: node scripts/fetch-weather.mjs --lat 44.7844 --lon 40.1169 --city "Белореченск"

      - name: Билд
        run: npm run build

      - name: Копирование data в out
        run: mkdir -p out/data && cp data/*.json out/data/

      - name: Коммит данных в репо
        run: |
          git config user.name "AgroPogoda Bot"
          git config user.email "bot@agropogoda.local"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
